name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  # A push made by the data workflow uses GITHUB_TOKEN, and GitHub deliberately
  # does not let such pushes trigger further workflows. Without this trigger a
  # data refresh would commit new numbers that never reach the site.
  workflow_run:
    workflows: ['Update stock data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; just queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # On a workflow_run trigger, only deploy if the data run actually succeeded.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+ for `node --experimental-strip-types`, which lets the test suite
          # import the TypeScript column registry without a bundler.
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Verify sorting behaviour
        run: npm test
        working-directory: web

      - name: Build
        working-directory: web
        # GitHub Pages project sites are served from /<repo>/, so the bundle has
        # to be built with a matching base path or every asset 404s.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
