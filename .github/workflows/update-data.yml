name: Update stock data

on:
  schedule:
    # 06:20 UTC on weekdays — after US close, before the European open.
    # Avoids the top of the hour, when GitHub's scheduler is most congested.
    - cron: '20 6 * * 1-5'
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Cap uncached symbols fetched this run (blank = no cap)'
        required: false
        type: string
      refresh_holdings:
        description: 'Re-download the index holdings file'
        required: false
        type: boolean
        default: false

# Only one data run at a time; a queued run waits rather than racing the commit.
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Per-symbol price history, quotes and SEC facts. Restoring this is what
      # makes a run resumable: Yahoo rate-limits hard, so a cold run may not
      # finish in one pass, and the next run picks up where this one stopped.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: stock-cache-${{ github.run_id }}
          restore-keys: |
            stock-cache-

      - name: Run pipeline
        env:
          # The SEC requires a real contact in the User-Agent, or it returns 403
          # and blocks the IP for ~10 minutes. Set this as a repository variable
          # under Settings > Secrets and variables > Actions > Variables.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.max_new }}" ]; then ARGS="$ARGS --max-new ${{ inputs.max_new }}"; fi
          if [ "${{ inputs.refresh_holdings }}" = "true" ]; then ARGS="$ARGS --refresh-holdings"; fi
          python -m pipeline.run $ARGS

      - name: Commit updated data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data data/seed
          if git diff --staged --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            ROWS=$(python -c "import json;print(len(json.load(open('web/public/data/stocks.json'))))")
            git commit -m "data: refresh ${ROWS} stocks ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A failed run means the validation guard rails rejected the dataset, or
      # the upstream source is down. The published data is untouched either way.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Data pipeline failed'
            const body = [
              `The scheduled data refresh failed.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `The published dataset was left untouched, so the site is still serving`,
              `the last good data. Most likely causes: Yahoo rate limiting (re-run to`,
              `resume from cache), or the validation guard rails rejecting a degraded`,
              `dataset.`,
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'pipeline-failure',
            })
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['pipeline-failure'],
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              })
            }
